[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line too long (ruff format handles this)
    "B008",  # do not perform function calls in default arguments (common in DRF)
    "N806",  # variable in function should be lowercase (conflicts with Django)
]
exclude = [
    "migrations/",
    ".venv/",
    "venv/",
]

[tool.ruff.per-file-ignores]
"*/settings/*.py" = ["F401", "F403"]   # wildcard imports are fine in settings
"tests/**" = ["S101"]                  # assert is fine in tests
